[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paired-reading-response-information"
version = "1.0.0"
description = "Paired evaluation of reader- and question-level response information for reading-comprehension prediction"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "joblib==1.5.3",
  "matplotlib==3.10.9",
  "numpy==2.2.6",
  "pandas==2.3.3",
  "pyarrow==25.0.1",
  "scikit-learn==1.7.2",
  "scipy==1.15.3",
  "wordfreq==3.1.1",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
paired-eval = "paired_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
